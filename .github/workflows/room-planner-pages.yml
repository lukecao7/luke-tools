name: Publish room planner

on:
  push:
    branches: [main]
    paths:
      - 'room-planner/**'
      - '.github/workflows/room-planner-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the offline layout and prepare the static files
        run: |
          node --check room-planner/app.js
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          folder = Path('room-planner')
          page = (folder / 'index.html').read_text()
          embedded = re.search(r'<script type="application/json" id="sharedRoomLayout">(.*?)</script>', page, re.S)
          assert embedded and json.loads(embedded[1]) == json.loads((folder / 'room-layout.json').read_text())
          PY
          mkdir -p _site/room-planner
          cp room-planner/{index.html,app.js,styles.css,furniture.webp,room-layout.json} _site/room-planner/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}room-planner/
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
