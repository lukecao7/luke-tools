<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>别刷忘了</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/48.png" width="30" height="30" alt=""><div><h1>别刷忘了</h1><p>网页使用时长</p></div><span class="badge">常驻提醒</span></header>
  <main>
    <section class="total"><span>今日累计</span><strong id="total">00:00:00</strong><small id="status">正在读取记录</small></section>
    <section class="sites" id="sites" aria-label="各网站今日使用时长"></section>
    <section class="history"><h2>最近记录</h2><div id="history"></div></section>
    <p class="explain">只累计正在浏览的网站，看视频时持续计时。切到后台或锁屏后自动停止累计。</p>
  </main>
  <footer><span class="footer-dot"></span>记录仅保存在本机 · 保留 90 个使用日</footer>
  <script src="core.js"></script><script src="popup.js"></script>
</body></html>
